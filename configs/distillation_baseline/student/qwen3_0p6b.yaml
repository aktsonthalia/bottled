# @package _global_
student:
  name: Qwen/Qwen3-0.6B
  dtype: bfloat16
  attn_implementation: kernels-community/flash-attn2


# SFTConfig fields, passed as keyword arguments: https://huggingface.co/docs/trl/v1.13.0/en/sft_trainer#trl.SFTConfig
training: # https://arxiv.org/html/2605.15239v1#S4 for qwen 0.6b
  # max_length: 4096
  max_length: null # padding_free does not truncate; TRL's default of 1024 would refuse to start
  seed: ${seed}
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 8 # 8 x 8 = 64 sequences per optimizer step
  lr_scheduler_type: cosine
  optim: adamw_torch_fused
  warmup_steps: 0.1
  padding_free: true

inference: # https://huggingface.co/Qwen/Qwen3-0.6B#best-practices, https://huggingface.co/Qwen/Qwen3-0.6B/blob/main/generation_config.json
  sampling_params:
    max_tokens: 512
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
    seed: ${seed}

sweep:
  learning_rates: [1.0e-5] # one student per learning rate

